services:
  mongodb:
    image: mongo:7
    container_name: posts_manager_db
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DB}
    ports:
      - '27019:27017'
    volumes:
      - mongo_data:/data/db
      - ./mongo-seed:/docker-entrypoint-initdb.d

  minio:
    image: minio/minio
    container_name: posts_manager_storage
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - '9000:9000'
      - '9001:9001'
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc
    container_name: posts_manager_storage_init
    depends_on:
      - minio
    volumes:
      - ./minio-seed:/minio-seed
    entrypoint: /bin/sh /minio-seed/init.sh
    restart: on-failure

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: posts_manager_api
    restart: unless-stopped
    depends_on:
      - mongodb
      - minio
    ports:
      - '${PORT}:${PORT}'
    environment:
      PORT: ${PORT}
      MONGO_URI: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongodb:27017/${MONGO_DB}?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio
      MINIO_PORT: ${MINIO_PORT}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL}

volumes:
  mongo_data:
  minio_data:
